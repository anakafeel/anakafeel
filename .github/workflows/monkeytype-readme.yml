name: generate monkeytype readme svg
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/monkeytype-readme.yml, .github/scripts/monkeytype-card.mjs]

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Draw the card
        run: node .github/scripts/monkeytype-card.mjs anakafeel "$RUNNER_TEMP/monkeytype.svg"
      - name: Publish the card to the monkeytype-readme branch if it changed
        run: |
          git fetch --depth=1 origin monkeytype-readme
          git worktree add card FETCH_HEAD
          cd card
          cp "$RUNNER_TEMP/monkeytype.svg" monkeytype.svg
          git rm -q --ignore-unmatch anakafeel-monkeytype-readme*.svg
          git add monkeytype.svg
          if git diff --cached --quiet; then
            echo "The card is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "Saim Hashmi"
          git config user.email "hashmisaim037@gmail.com"
          git commit -qm "monkeytype: refresh stats"
          git push -q origin HEAD:monkeytype-readme
