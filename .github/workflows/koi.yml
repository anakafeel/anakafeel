# Copy into your profile repository as .github/workflows/koi.yml, then embed
# <img src="koi/koi.gif" width="256" alt="My koi"> in its README.md.
name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Temporary: built from my fork's leap-year fix until upstream releases it.
      # Then switch back to `uses: yalongwastaken/git-koi@v1` with `body: white`.
      - name: Install git-koi from the fork
        run: cargo install --locked --git https://github.com/anakafeel/git-koi --rev b9e9ff28b421fedad66c9992b995c30516b6cff0
      - name: Draw the koi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git-koi collect "${{ github.repository_owner }}" --output "$RUNNER_TEMP/koi-snapshot.json"
          git-koi render "$RUNNER_TEMP/koi-snapshot.json" --output-dir koi --body white
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "Saim Hashmi"
          git config user.email "hashmisaim037@gmail.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
